<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <div class="game-card">

            <div class="game-icon">🎯</div>

            <h1>Number Guessing Game</h1>

            <p class="description">
                Guess the secret number between <strong>1 and 100</strong>.
            </p>

            <div class="attempts">
                Attempts Remaining:
                <span id="attempts">7</span>
            </div>

            <div class="input-section">

                <input
                    type="number"
                    id="guessInput"
                    min="1"
                    max="100"
                    placeholder="Enter your guess"
                >

                <button id="guessButton" onclick="checkGuess()">
                    Guess
                </button>

            </div>

            <p id="message" class="message">
                Start guessing!
            </p>

            <button
                id="restartButton"
                class="restart-button"
                onclick="restartGame()"
            >
                🔄 Play Again
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
